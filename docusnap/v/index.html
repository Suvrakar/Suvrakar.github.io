<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<title>Verify DocuSnap Seal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23188038' d='M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4Zm-2 16-4-4 1.4-1.4L10 14.2l6.6-6.6L18 9l-8 8Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4Zm-2 16-4-4 1.4-1.4L10 14.2l6.6-6.6L18 9l-8 8Z"/></svg>
    DocuSnap
  </a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="bn" aria-pressed="false" lang="bn">বাং</button>
  </div>
</header>

<main>
  <noscript><div class="card"><p>JavaScript is needed to check the seal on this device.</p></div></noscript>

  <!-- Paste box (shown when there is no #data) -->
  <section id="paste" class="card" hidden>
    <h1 class="paste-title" data-t="pasteTitle"></h1>
    <p class="hint flush" data-t="pasteHelp"></p>
    <form id="pasteForm">
      <label for="pasteInput" class="hint label" data-t="pastePlaceholder"></label>
      <textarea id="pasteInput" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button class="btn" type="submit" data-t="verifyBtn"></button>
    </form>
    <p class="footnote" data-t="privacy"></p>
  </section>

  <!-- Result -->
  <section id="result" hidden>
    <div class="card status" id="statusCard" aria-live="polite">
      <div class="status-icon" id="statusIcon"></div>
      <h1 id="statusTitle"></h1>
      <p class="sealed-by" id="sealedBy"></p>
      <div id="issuerBlock" hidden>
        <p class="hint" id="issuerHint"></p>
        <div class="issuer">
          <code id="issuerId" translate="no"></code>
          <button type="button" class="btn-text" id="copyBtn" data-t="copy"></button>
        </div>
      </div>
    </div>

    <div class="card" id="detailsCard" hidden>
      <h2 data-t="checkPaper"></h2>
      <dl class="details" id="details"></dl>
    </div>

    <a class="btn" id="getApp" href="https://play.google.com/store/apps/details?id=com.docusnap.docusnap" rel="noopener" data-t="getApp"></a>
    <button type="button" class="btn secondary" id="another" data-t="checkAnother"></button>
    <p class="footnote" data-t="strongest"></p>
    <p class="footnote" data-t="privacy"></p>
  </section>
</main>

<script type="module" src="../assets/app.js"></script>
</body>
</html>
